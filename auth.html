<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Code Playground</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">
        <!-- Logo -->
        <div class="CP_logo">
            <a href="#" id="logo-link" title="Logo">
                <img src="code playground logo.png" alt="Logo" class="logo">
            </a>
        </div>

        <!-- Auth Box -->
        <div class="auth-box">
            <!-- Sign In Section -->
            <div class="auth-section active" id="signin-section">
                <h2 class="auth-title">Sign In</h2>

                <!-- Social Login Buttons -->
                <div class="social-login">
                    <button class="social-btn google-btn">
                        <img src="Google_logo.png" alt="Google Logo"> Sign in with Google
                    </button>
                    <!-- OR Divider -->
                    <div class="lines">
                        <div class="line"></div> OR <div class="line"></div>
                    </div>
                    <button class="social-btn apple-btn">
                        <img src="Apple_logo.png" alt="Apple Logo"> Sign in with Apple
                    </button>
                </div>



                <!-- Email & Password Fields -->
                <div class="text-field">
                    <label class="auth-label">Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="text-field">
                    <label class="auth-label">Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button class="CP_button">Login</button>
                <p>Don't have an account? <span class="toggle-btn" id="switch-to-signup">Sign Up</span></p>
            </div>

            <!-- Sign Up Section -->
            <div class="auth-section" id="signup-section">
                <h2 class="auth-title">Sign Up</h2>
                <div class="text-field">
                    <label class="auth-label">Full Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="text-field">
                    <label class="auth-label">Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="text-field">
                    <label class="auth-label">Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <div class="text-field">
                    <label class="auth-label">Confirm Password</label>
                    <input type="password" placeholder="Re-enter your password" required>
                </div>
                <button class="CP_button">Register</button>
                <p>Already have an account? <span class="toggle-btn" id="switch-to-signin">Sign In</span></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>

</body>

</html>
