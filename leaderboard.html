<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Code Playground</title>
    <link rel="stylesheet" href="css/leaderboard.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="home.html">
                <img src="lo.png" alt="Logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="explore.html">Explore</a></li>
            <li><a href="problems.html">Problems</a></li>
            <li><a href="contests.html">Contests</a></li>
            <li><a href="discuss.html">Discuss</a></li>
            <li><a href="contact.html">About Us</a></li>
            <li><a href="profile.html" class="profile-icon">👤</a></li>
        </ul>
    </nav>

    <!-- Leaderboard Section -->
    <section class="leaderboard-section">
        <h2>Contest Leaderboard</h2>

        <!-- Contest Selection -->
        <div class="contest-selector">
            <label for="contest-dropdown">Select Contest:</label>
            <select id="contest-dropdown">
                <option value="january-challenge">January Code Challenge</option>
                <option value="data-marathon">Data Structures Marathon</option>
                <option value="algorithm-challenge">Algorithm Coding Challenge</option>
            </select>
        </div>

        <!-- Leaderboard Table -->
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Username</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>JohnDoe123</td>
                    <td>95</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>CodeMaster</td>
                    <td>92</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>DevKing</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>SpeedCoder</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>LogicPro</td>
                    <td>85</td>
                </tr>
            </tbody>
        </table>
        
        <div class="pagination">
            <button id="prev-page">Previous</button>
            <span id="current-page">1 / 5</span>
            <button id="next-page">Next</button>
        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Code Playground. All rights reserved.</p>
    </footer>

    <script src="js/leaderboard.js"></script>

</body>

</html>
